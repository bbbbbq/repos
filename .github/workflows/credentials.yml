name: Credentials

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gevico-fork-credentials
  cancel-in-progress: false

jobs:
  credentials:
    if: vars.FORK_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: mkdir -p .work/tmp
      - run: npm --prefix automation ci --no-fund --no-audit --ignore-scripts
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - run: npm --prefix automation run ci:credentials
        env:
          FORK_USER_TOKEN: ${{ secrets.FORK_USER_TOKEN }}
          CONTROL_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/.work/tmp
