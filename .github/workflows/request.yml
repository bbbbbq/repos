name: Request

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to validate
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: request-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  request:
    name: Preview
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: mkdir -p .work/tmp
      - run: npm ci --no-fund --no-audit --ignore-scripts
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        if: vars.AUTOMATION_ENABLED == 'true'
        id: app
        with:
          client-id: ${{ vars.READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.READ_APP_PRIVATE_KEY }}
          owner: gevico
          permission-administration: read
          permission-contents: read
          permission-members: read
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        if: vars.AUTOMATION_ENABLED == 'true'
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: npm run ci:request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          CONTROL_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/.work/tmp
